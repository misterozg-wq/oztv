name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -alias iptvplayer \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass iptvplayer -keypass iptvplayer \
            -dname "CN=IPTV Player, O=IPTV Player, C=FR"

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk IPTV-Player.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player
          path: IPTV-Player.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: IPTV Player (build ${{ github.run_number }})
          files: IPTV-Player.apk
